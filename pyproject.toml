[project]
name = "basic-translator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseAdrianRodriguezGonzalez", email = "kerpador@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=5.1.0",
    "jupyter>=1.1.1",
    "lab>=8.10",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]

[project.scripts]
basic-translator = "basic_translator:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
